<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Official lead-specific DeltaR results</title>
  <desc id="desc">Grouped bar chart comparing B3 leak-free TyphoFormer, B4 TyphoFormer++ safe raw, and B4 TyphoFormer++ with validation CV calibration at 6, 12, 18, and 24 hour leads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .tick { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .value { font: 700 12px Arial, sans-serif; fill: #0f172a; }
      .note { font: 400 13px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1120" height="520" fill="url(#bg)"/>
  <text x="62" y="58" class="title">Official HURDAT2 12 -> 1 Safe-Negative Results</text>
  <text x="62" y="86" class="subtitle">DeltaR km on 2022-2024 Atlantic test storms. Lower is better. Neural rows are mean over seeds 42 / 123 / 2024.</text>

  <line x1="118" y1="410" x2="1040" y2="410" class="axis"/>
  <line x1="118" y1="120" x2="118" y2="410" class="axis"/>

  <g>
    <line x1="118" y1="303" x2="1040" y2="303" class="grid"/>
    <text x="74" y="308" class="tick">100</text>
    <line x1="118" y1="196" x2="1040" y2="196" class="grid"/>
    <text x="74" y="201" class="tick">200</text>
    <text x="86" y="414" class="tick">0</text>
  </g>

  <rect x="716" y="54" width="18" height="18" fill="#64748b"/>
  <text x="742" y="68" class="tick">B3 leak-free TyphoFormer</text>
  <rect x="716" y="82" width="18" height="18" fill="#2563eb"/>
  <text x="742" y="96" class="tick">B4 TyphoFormer++ safe raw</text>
  <rect x="716" y="110" width="18" height="18" fill="#14b8a6"/>
  <text x="742" y="124" class="tick">B4 safe + val CV calibration</text>

  <g>
    <text x="191" y="448" class="label">6h</text>
    <rect x="158" y="368" width="30" height="42" fill="#64748b"/>
    <rect x="194" y="374" width="30" height="36" fill="#2563eb"/>
    <rect x="230" y="374" width="30" height="36" fill="#14b8a6"/>
    <text x="151" y="359" class="value">39.5</text>
    <text x="191" y="365" class="value">34.2</text>
    <text x="226" y="365" class="value">34.3</text>
  </g>

  <g>
    <text x="402" y="448" class="label">12h</text>
    <rect x="370" y="301" width="30" height="109" fill="#64748b"/>
    <rect x="406" y="317" width="30" height="93" fill="#2563eb"/>
    <rect x="442" y="318" width="30" height="92" fill="#14b8a6"/>
    <text x="362" y="292" class="value">101.8</text>
    <text x="401" y="308" class="value">86.7</text>
    <text x="438" y="309" class="value">86.2</text>
  </g>

  <g>
    <text x="617" y="448" class="label">18h</text>
    <rect x="586" y="227" width="30" height="183" fill="#64748b"/>
    <rect x="622" y="243" width="30" height="167" fill="#2563eb"/>
    <rect x="658" y="244" width="30" height="166" fill="#14b8a6"/>
    <text x="577" y="218" class="value">171.0</text>
    <text x="613" y="234" class="value">156.2</text>
    <text x="649" y="235" class="value">155.0</text>
  </g>

  <g>
    <text x="828" y="448" class="label">24h</text>
    <rect x="798" y="131" width="30" height="279" fill="#64748b"/>
    <rect x="834" y="163" width="30" height="247" fill="#2563eb"/>
    <rect x="870" y="165" width="30" height="245" fill="#14b8a6"/>
    <text x="789" y="122" class="value">260.7</text>
    <text x="825" y="154" class="value">230.5</text>
    <text x="861" y="156" class="value">229.0</text>
  </g>

  <text x="62" y="485" class="note">Main reading: TyphoFormer++ improves the local leak-free TyphoFormer reproduction at every lead under the same audited split and safe-negative retrieval policy.</text>
</svg>
